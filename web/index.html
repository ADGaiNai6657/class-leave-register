<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>班级请假登记</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-start">
        <button type="button" class="icon-btn" id="menuBtn" aria-label="切换功能" aria-controls="pageDrawer" aria-expanded="false">
          <svg class="icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
            <path d="M3.25 6.25h13.5M3.25 10h13.5M3.25 13.75h13.5" />
          </svg>
        </button>
        <div class="brand">
          <h1 id="pageTitle">班级请假登记</h1>
          <p class="roster-info" id="rosterInfo">正在读取花名册……</p>
        </div>
      </div>
      <div class="name-search" role="search" aria-label="学生姓名搜索">
        <label class="control-label" for="nameSearch">搜索姓名</label>
        <input id="nameSearch" type="search" placeholder="全名、首字或首字母" autocomplete="off" spellcheck="false" aria-controls="grid rosterColumns" aria-describedby="searchStatus" />
        <button type="button" class="icon-btn" id="clearSearch" aria-label="清空搜索" title="清空搜索" hidden>×</button>
      </div>
      <div class="controls">
        <div class="size-control">
          <span class="control-label" id="sizeLabel">卡片大小</span>
          <div class="segmented" id="sizeGroup" role="group" aria-labelledby="sizeLabel">
            <button type="button" data-size="small">小</button>
            <button type="button" data-size="medium" class="active">中</button>
            <button type="button" data-size="large">大</button>
          </div>
        </div>
        <button type="button" class="btn" id="importBtn">读取 CSV</button>
        <button type="button" class="icon-btn" data-open-settings aria-label="设置" title="设置" aria-haspopup="dialog">
          <svg class="icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M8.4 3h3.2l.4 1.8 1.3.7 1.8-.5 1.6 2.8-1.3 1.3v1.8l1.3 1.3-1.6 2.8-1.8-.5-1.3.7-.4 1.8H8.4L8 15.2l-1.3-.7-1.8.5-1.6-2.8 1.3-1.3V9.1L3.3 7.8 4.9 5l1.8.5L8 4.8Z"/><circle cx="10" cy="10" r="2.4"/></svg>
        </button>
        <button type="button" class="btn primary" id="exportBtn">导出</button>
      </div>
    </header>

    <div class="app-layout">
      <nav id="pageDrawer" class="page-drawer" aria-label="功能切换" aria-hidden="true" inert>
        <button type="button" class="btn primary" data-page="leave" aria-current="page">
          <svg class="icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
            <rect x="3.25" y="4.75" width="13.5" height="12" rx="2.5" />
            <path d="M3.25 8.75h13.5M6.9 3.25v2.5M13.1 3.25v2.5" />
          </svg>
          <span class="nav-label">班级请假登记</span>
        </button>
        <button type="button" class="btn" data-page="roster">
          <svg class="icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
            <path d="M4 5.75h12M4 10h12M4 14.25h7.5" />
          </svg>
          <span class="nav-label">花名册</span>
        </button>
        <button type="button" class="btn drawer-settings" data-open-settings aria-label="设置" aria-haspopup="dialog">
          <svg class="icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M8.4 3h3.2l.4 1.8 1.3.7 1.8-.5 1.6 2.8-1.3 1.3v1.8l1.3 1.3-1.6 2.8-1.8-.5-1.3.7-.4 1.8H8.4L8 15.2l-1.3-.7-1.8.5-1.6-2.8 1.3-1.3V9.1L3.3 7.8 4.9 5l1.8.5L8 4.8Z"/><circle cx="10" cy="10" r="2.4"/></svg>
          <span class="nav-label">设置</span>
        </button>
      </nav>

      <div class="workspace">
        <div class="banner-area" id="bannerArea"></div>
        <p id="searchStatus" class="search-status" role="status" aria-live="polite" aria-atomic="true" hidden></p>

        <main class="grid" id="grid" data-size="medium" aria-label="学生卡片列表"></main>

        <main id="rosterGrid" class="roster-page" aria-label="花名册" hidden>
          <div class="roster-toolbar">
            <div class="roster-summary">
              <span class="roster-total"><strong id="rosterTotal">0</strong> 名学生</span>
              <span class="roster-divider" aria-hidden="true"></span>
              <span class="roster-stat" id="rosterFilledStat">已填 0 条</span>
            </div>
            <div class="roster-headers">
              <span class="roster-headers-caption" id="headersCaption">导出列名</span>
              <label class="roster-field">
                <span class="roster-field-label">文字</span>
                <input type="text" data-header="text" maxlength="100" placeholder="留空" aria-label="文字列标题" />
              </label>
              <label class="roster-field">
                <span class="roster-field-label">选项</span>
                <input type="text" data-header="choice" maxlength="100" placeholder="留空" aria-label="选项列标题" />
              </label>
            </div>
          </div>
          <div class="roster-columns" id="rosterColumns"></div>
        </main>

        <footer class="statusbar">
          <span>双击卡片填写请假信息，再次双击可收起</span>
          <span id="statLine">已填写 0 / 0</span>
        </footer>
      </div>
    </div>

    <dialog class="modal settings-dialog" id="settingsDialog" aria-labelledby="settingsTitle">
      <form method="dialog" class="modal-head">
        <h2 id="settingsTitle">设置</h2>
        <button class="icon-btn" aria-label="关闭设置">
          <svg class="icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
            <path d="M6 6l8 8M14 6l-8 8" />
          </svg>
        </button>
      </form>
      <div class="settings-options">
        <label class="settings-row">
          外观
          <select id="themeSetting" autofocus>
            <option value="system">跟随系统</option>
            <option value="light">浅色</option>
            <option value="dark">深色</option>
          </select>
        </label>
        <label class="settings-row">
          启动时显示
          <select id="startPageSetting">
            <option value="leave">班级请假登记</option>
            <option value="roster">花名册</option>
          </select>
        </label>
        <label class="settings-row">
          花名册瀑布流列数
          <select id="rosterColumnSetting">
            <option value="1">1 列</option>
            <option value="2">2 列</option>
            <option value="3">3 列</option>
            <option value="4">4 列</option>
          </select>
        </label>
        <label class="settings-row">
          请假登记卡片大小
          <select id="cardSizeSetting">
            <option value="small">小</option>
            <option value="medium">中</option>
            <option value="large">大</option>
          </select>
        </label>
        <fieldset>
          <legend>默认导出范围</legend>
          <label class="settings-row">
            请假登记包含未填写的学生
            <input type="checkbox" id="leaveScopeSetting" />
          </label>
          <label class="settings-row">
            花名册包含未填写的学生
            <input type="checkbox" id="rosterScopeSetting" />
          </label>
        </fieldset>
      </div>
      <p id="settingsStatus" class="modal-status" role="status" hidden></p>
    </dialog>

    <div class="modal-backdrop" id="modalBackdrop" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-head">
          <h2 id="modalTitle">导出登记结果</h2>
          <button type="button" class="icon-btn" id="modalClose" aria-label="关闭">
            <svg class="icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
              <path d="M6 6l8 8M14 6l-8 8" />
            </svg>
          </button>
        </div>
        <p class="modal-summary" id="modalSummary"></p>
        <label class="export-scope">
          <input type="checkbox" id="includeUnfilled" />
          包含未填写的学生
        </label>
        <div class="modal-actions">
          <button type="button" class="btn option" id="copyBtn">
            <span class="option-title">复制到剪切板</span>
            <span class="option-desc">按列对齐，可直接粘贴到聊天窗口</span>
          </button>
          <button type="button" class="btn option primary" id="copyCsvBtn">
            <span class="option-title">复制到剪切板，并输出 CSV</span>
            <span class="option-desc">CSV 保存到项目根目录，UTF-8 编码（含 BOM），中文不乱码</span>
          </button>
        </div>
        <div class="modal-status" id="modalStatus" role="status" aria-live="polite"></div>
        <div class="modal-foot">
          <button type="button" class="btn ghost" id="revealBtn" hidden>在文件夹中显示</button>
          <button type="button" class="btn ghost" id="modalCloseBottom">关闭</button>
        </div>
      </div>
    </div>

    <div class="modal-backdrop" id="importBackdrop" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="importTitle">
        <div class="modal-head">
          <h2 id="importTitle">读取 CSV 登记数据</h2>
          <button type="button" class="icon-btn" id="importClose" aria-label="关闭">
            <svg class="icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
              <path d="M6 6l8 8M14 6l-8 8" />
            </svg>
          </button>
        </div>
        <p class="modal-summary">
          可以读取本应用导出的「请假登记-*.csv」，也支持表头为「姓名 / 请假理由 / 是否补假」的 CSV。
        </p>
        <div class="dropzone" id="dropZone" tabindex="0" role="button" aria-label="拖拽 CSV 到此处，或点击选择文件">
          <span class="dropzone-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M12 4.5v9.5m0 0 3.75-3.75M12 14l-3.75-3.75M5 17.5h14" />
            </svg>
          </span>
          <span class="dropzone-title">把 CSV 文件拖到这里</span>
          <span class="dropzone-desc">或点击此处选择文件（默认打开 CSV 的导出目录）</span>
        </div>
        <input type="file" id="fileInput" accept=".csv,text/csv" hidden />
        <div class="modal-status" id="importStatus" role="status" aria-live="polite"></div>
        <div class="modal-foot">
          <button type="button" class="btn ghost" id="importCloseBottom">关闭</button>
        </div>
      </div>
    </div>

    <script src="vendor/pinyin-pro/pinyin-pro.js"></script>
    <script src="name-search.js"></script>
    <script src="app.js"></script>
  </body>
</html>
